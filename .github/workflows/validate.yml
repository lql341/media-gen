name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: bash --version | head -1; python3 --version; curl --version | head -1

      - name: Shell syntax
        run: |
          for file in scripts/*.sh tests/*.sh; do
            bash -n "$file" || exit 1
          done

      - name: ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Offline tests (no network, no paid requests)
        run: |
          bash tests/test-config.sh
          bash tests/test-cli.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed secrets
        run: |
          if git grep -nE "sk-[A-Za-z0-9]{16,}|Bearer [A-Za-z0-9]{20,}" -- . ':!tests' ; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "no obvious secrets found"
